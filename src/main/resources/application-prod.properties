# Production settings, used with --spring.profiles.active=prod (see Dockerfile).
server.port=${PORT:8080}
vaadin.launch-browser=false

# The database lives on the mounted data volume. WAL lets Litestream replicate it
# while the app writes; busy_timeout waits for Litestream's checkpoints.
spring.datasource.url=jdbc:sqlite:${APP_DATA_DIR:/data}/app.db?journal_mode=WAL&synchronous=NORMAL&busy_timeout=5000

# CloudFront terminates HTTPS and reports the viewer's scheme in CloudFront-Forwarded-Proto.
# Only CloudFront can reach the app (security group), so every proxy is trusted.
server.forward-headers-strategy=native
server.tomcat.remoteip.protocol-header=CloudFront-Forwarded-Proto
server.tomcat.remoteip.internal-proxies=.*
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# The first admin comes from APP_BOOTSTRAP_ADMIN_PASSWORD (see AdminBootstrap); never seed demo users.
app.seed-users=false
