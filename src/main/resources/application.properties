server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.dijo

# SQLite creates app.db if it does not exist.
spring.datasource.url=jdbc:sqlite:./app.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Keep the initial SQLite setup simple.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# Run the idempotent schema script at startup.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:benefits-schema.sql

# Enable explicitly when you want to create the initial users.
app.seed-users=false